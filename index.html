
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRAND i10 MUSIC</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #101010;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
.container {
  max-width: 440px;
  margin: auto;
  padding: 35px 22px;
}
.logo { font-size: 55px; margin-bottom: 12px; }
h1 { letter-spacing: 2px; font-size: 27px; }
.green { color: #1ed760; }
.subtitle { color: #aaa; margin-bottom: 30px; }
.card {
  background: #202020;
  padding: 23px;
  border-radius: 17px;
  margin-top: 20px;
}
input {
  width: 100%;
  padding: 15px;
  border-radius: 9px;
  border: none;
  font-size: 16px;
  margin: 12px 0;
}
button {
  background: #1ed760;
  color: #101010;
  font-weight: bold;
  border: none;
  border-radius: 30px;
  padding: 15px;
  width: 100%;
  font-size: 16px;
  cursor: pointer;
}
.note { color: #999; font-size: 12px; margin-top: 25px; }
</style>
</head>
<body>
<div class="container">
  <div class="logo">🎵</div>
  <h1>GRAND i10 <span class="green">MUSIC</span></h1>
  <p class="subtitle">Tu música, tu viaje.</p>

  <div class="card">
    <h2>¡Tú eliges la música!</h2>
    <p>Busca tu canción favorita y prepárate para disfrutar el viaje.</p>
    <input type="text" placeholder="Nombre de canción o artista" disabled>
    <button disabled>BUSCAR EN SPOTIFY</button>
    <p class="note">La conexión con Spotify estará disponible próximamente.</p>
  </div>

  <p class="note">GRAND i10 MUSIC · Hecho para disfrutar 🎧</p>
</div>
</body>
</html>
